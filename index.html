<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Centered viewport box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* STACK LAYER 1: Tiled Dithered Stars Background */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: url('stars-dithered.gif') repeat;
            background-size: 65px 65px;
            z-index: 1;
        }

        /* SOLID BLACK SIDE MASKS (Crops wall and leaves at borders) */
        .side-mask-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998; 
            pointer-events: none;
        }

        .side-mask-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998;
            pointer-events: none;
        }

        /* STACK LAYER 1.5: Moon */
        .moon {
            position: absolute;
            top: 4vh;
            right: 25vw;
            width: auto;
            height: 18vh;
            z-index: 1;
            pointer-events: none;
        }

        /* STACK LAYER 2: Water */
        .water-bg {
            position: absolute;
            top: 65%; 
            bottom: 0;
            left: 0;
            width: 100%;
            background: url('water-dithered.gif') repeat;
            background-size: 64px 64px; 
            z-index: 2;
        }

        /* STACK LAYER 3: Main Stone Archway Frame */
        .wall-frame {
            position: absolute;
            top: 20%; 
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh; 
            max-width: 100vw;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        /* STACK LAYER 4: Center Interactive Door */
        .door-container {
            position: absolute;
            z-index: 4;
            top: 55%; 
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 80vh; 
            width: auto;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 20px #8a2be2) brightness(1.2);
            transform: translate(-50%, -51%);
        }

        /* STACK LAYER 5: Foreground Rocks */
        .foreground-rocks {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        /* STACK LAYER 6: Left Leaf Cluster (Lowered 40%) */
        .leaf-left {
            position: absolute;
            bottom: -54vh; 
            left: -6vw; 
            width: 48vw; 
            height: auto;
            object-fit: contain;
            z-index: 6; 
            pointer-events: none;
            transform: rotate(-15deg); 
        }

        /* STACK LAYER 6: Right Leaf Cluster */
        .leaf-right {
            position: absolute;
            bottom: -12vh; 
            right: -5vw; 
            width: 44vw;
            height: auto;
            object-fit: contain;
            z-index: 6; 
            pointer-events: none;
            transform: scaleX(-1) rotate(25deg); 
        }

        /* MOBILE / PHONE SPECIFIC STYLES */
        @media (max-width: 768px) or (max-aspect-ratio: 1/1) {
            #viewport {
                height: auto;
                aspect-ratio: 16 / 10;
                max-height: 85vh;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            }

            .side-mask-left, 
            .side-mask-right {
                width: 10vw;
            }

            .moon {
                height: 12vh;
                top: 2vh;
                right: 22vw;
            }

            .wall-frame, 
            .foreground-rocks {
                top: 20%;
                height: 80vh;
                width: auto;
            }

            .door-container {
                top: 55%;
            }

            .door-container img {
                height: 80vh;
                width: auto;
            }

            .water-bg {
                top: 65%;
            }

            .leaf-left {
                width: 55vw;
                bottom: -32vh;
                left: -8vw;
            }

            .leaf-right {
                width: 52vw;
                bottom: -8vh;
                right: -6vw;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Tiled Stars Sky Background -->
        <div class="stars-bg"></div>

        <!-- Solid Black Side Crop Masks -->
        <div class="side-mask-left"></div>
        <div class="side-mask-right"></div>

        <!-- Moon in sky -->
        <img src="moon-dithered.png" alt="Moon" class="moon">

        <!-- Tiled Dithered Water -->
        <div class="water-bg"></div>

        <!-- Main Stone Wall Frame -->
        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <!-- Interactive Center Door -->
        <div class="door-container" onclick="enterDoor('davis.html')">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <!-- Foreground Rocks Layer -->
        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">

        <!-- Left Leaves (Lowered 40%) -->
        <img src="leafs-dithered.png" alt="Left Leaves" class="leaf-left">

        <!-- Right Leaves -->
        <img src="leafs-dithered.png" alt="Right Leaves" class="leaf-right">
    </div>

    <!-- Door Opening Sound Effect -->
    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        function enterDoor(destination) {
            var audio = document.getElementById("doorAudio");
            
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) { /* Audio fallback */ });
            }

            setTimeout(function() {
                window.location.href = destination;
            }, 600);
        }
    </script>

</body>
</html>
