<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0px;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Viewport Box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* ========================================================= */
        /* 1. DESKTOP STYLES (DEFAULT)                               */
        /* ========================================================= */

        /* STACK LAYER 1: Base Tiled Sky */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background-image: url('stars-dithered.gif');
            background-repeat: repeat;
            background-size: 65px 65px;
            z-index: 1;
        }

        /* Shooting Star Overlay */
        .stars-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('no%20shooting%20star-dithered.gif');
            background-repeat: repeat;
            background-size: 130px 130px;
            opacity: 0;
            animation: rareShootingStar 30s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes rareShootingStar {
            0%, 94%, 100% {
                opacity: 0;
            }
            97% {
                opacity: 0.85;
            }
        }

        .side-mask-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998; 
            pointer-events: none;
        }

        .side-mask-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998;
            pointer-events: none;
        }

        .moon {
            position: absolute;
            top: 2vh;
            right: 40vw;
            width: auto;
            height: 12vh;
            z-index: 1;
            pointer-events: none;
        }

        .water-bg {
            position: absolute;
            top: 59%;
            bottom: 0;
            left: 0;
            width: 100%;
            background: url('water-dithered.gif') repeat;
            background-size: 64px 64px;
            z-index: 2;
        }

        .wall-frame {
            position: absolute;
            top: 20%; 
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh; 
            max-width: 100vw;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        .door-container {
            position: absolute;
            z-index: 4;
            top: 59%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 80vh;
            width: auto;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 20px #8a2be2) brightness(1.2);
            transform: translate(-50%, -51%);
        }

        .foreground-rocks {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        .leaf-left {
            position: absolute;
            bottom: -43vh;
            left: -40vw;
            width: 82vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        .leaf-right {
            position: absolute;
            bottom: -12vh;
            right: -5vw;
            width: 48vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            transform: scaleX(-1) rotate(25deg);
        }

        /* Dark Room Overlay & Canvas Stage */
        #darkness-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #clay-canvas {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* ========================================================= */
        /* 2. PHONE STYLES ONLY                                      */
        /* ========================================================= */
        @media (max-width: 768px) {
            #viewport {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .side-mask-left, 
            .side-mask-right {
                width: 5vw;
            }

            .moon {
                height: 10vh;
                top: 2vh;
                right: 15vw;
            }

            .wall-frame, 
            .foreground-rocks {
                top: 25%;
                height: 60vh;
                width: auto;
            }

            .door-container {
                top: 51%;
            }

            .door-container img {
                height: 60vh;
                width: auto;
            }

            .water-bg {
                top: 55%;
            }

            .leaf-left {
                width: 60vw;
                bottom: -28vh;
                left: -12vw;
            }

            .leaf-right {
                width: 55vw;
                bottom: -8vh;
                right: -10vw;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Background Stars -->
        <div class="stars-bg"></div>

        <!-- Solid Black Side Crop Masks -->
        <div class="side-mask-left"></div>
        <div class="side-mask-right"></div>

        <!-- Moon -->
        <img src="moon-dithered.png" alt="Moon" class="moon">

        <!-- Water -->
        <div class="water-bg"></div>

        <!-- Main Stone Wall Frame -->
        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <!-- Interactive Center Door -->
        <div class="door-container" onclick="openDoor()">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <!-- Foreground Rocks Layer -->
        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">

        <!-- Left Leaves -->
        <img src="leafs-dithered.png" alt="Left Leaves" class="leaf-left">

        <!-- Right Leaves -->
        <img src="leafs-dithered.png" alt="Right Leaves" class="leaf-right">
    </div>

    <!-- Complete Darkness Room Overlay -->
    <div id="darkness-room">
        <canvas id="clay-canvas"></canvas>
    </div>

    <!-- Audio Effect -->
    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        function openDoor() {
            var audio = document.getElementById("doorAudio");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) {});
            }

            // Show Darkness Room
            var room = document.getElementById("darkness-room");
            room.style.display = "flex";

            // Load and Play GIF once onto Canvas
            playGifOnce('clay face.gif', 'clay-canvas', 2500); 
            // NOTE: Replace '2500' above with the exact length of your GIF in milliseconds (e.g. 3000 = 3 seconds)
        }

        function playGifOnce(gifSrc, canvasId, animationDurationMs) {
            var canvas = document.getElementById(canvasId);
            var ctx = canvas.getContext('2d');
            var img = new Image();
            
            var startTime = null;
            var animFrameId = null;

            img.onload = function() {
                canvas.width = img.naturalWidth || 800;
                canvas.height = img.naturalHeight || 600;

                function render(timestamp) {
                    if (!startTime) startTime = timestamp;
                    var elapsed = timestamp - startTime;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    if (elapsed < animationDurationMs) {
                        animFrameId = requestAnimationFrame(render);
                    } else {
                        // Freeze on final state
                        cancelAnimationFrame(animFrameId);
                    }
                }

                // Append timestamp query parameter to force fresh GIF playback start
                img.src = gifSrc + '?t=' + new Date().getTime();
                animFrameId = requestAnimationFrame(render);
            };

            img.src = gifSrc;
        }
    </script>

</body>
</html>
