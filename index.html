<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --body-bg-image: url('https://sadhost.neocities.org/images/tiles/purplesky.gif');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            background-image: var(--body-bg-image);
            background-size: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Centered viewport box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* STACK LAYER 1: Stars Sky Background */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: url('stars.gif') repeat;
            z-index: 1;
        }

        /* STACK LAYER 2: Tiled Water Background */
        .water-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            /* 'repeat' makes the GIF tile horizontally and vertically like a grid */
            background: url('water.gif') repeat;
            /* Controls tile size: set explicitly (e.g. 64px or 128px) so it doesn't stretch */
            background-size: 64px 64px; 
            z-index: 2;
        }

        /* STACK LAYER 3: Main Stone Archway Frame */
        .wall-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
            pointer-events: none;
        }

        /* STACK LAYER 4: Center Interactive Door */
        .door-container {
            position: absolute;
            z-index: 4;
            top: 42%; 
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 72%;
            width: auto;
            max-height: 700px;
            min-height: 350px;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 15px #8a2be2) brightness(1.15);
            transform: translate(-50%, -52%);
        }

        /* STACK LAYER 5: Foreground Rocks */
        .foreground-rocks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Animated Backgrounds -->
        <div class="stars-bg"></div>
        <div class="water-bg"></div>

        <!-- Main Stone Wall Frame -->
        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <!-- Interactive Center Door -->
        <div class="door-container" onclick="enterDoor('davis.html')">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <!-- Foreground Rocks Layer -->
        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">
    </div>

    <!-- Door Opening Sound Effect -->
    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        function enterDoor(destination) {
            var audio = document.getElementById("doorAudio");
            
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) { /* Audio fallback */ });
            }

            setTimeout(function() {
                window.location.href = destination;
            }, 600);
        }
    </script>

</body>
</html>
