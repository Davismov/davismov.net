<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Centered viewport box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* BATTLESHIP GRID OVERLAY */
        #viewport::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 0, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 0, 0.5) 1px, transparent 1px);
            background-size: 10% 10%;
            box-shadow: inset 0 0 0 2px rgba(255, 0, 0, 0.8);
        }

        #viewport::after {
            content: "A  \00a0\00a0 B  \00a0\00a0 C  \00a0\00a0 D  \00a0\00a0 E  \00a0\00a0 F  \00a0\00a0 G  \00a0\00a0 H  \00a0\00a0 I  \00a0\00a0 J";
            position: absolute;
            top: 5px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            font-size: 16px;
            z-index: 10000;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        /* STACK LAYER 1: Moon (Top Right Corner) */
        .moon {
            position: absolute;
            top: 4vh;
            right: 4vw;
            width: auto;
            height: 18vh;
            z-index: 1;
            pointer-events: none;
        }

        /* STACK LAYER 2: Water (Starts row 7 down to bottom row 10) */
        .water-bg {
            position: absolute;
            top: 60%; 
            bottom: 0;
            left: 0;
            width: 100%;
            background: url('water-dithered.gif') repeat;
            background-size: 64px 64px; 
            z-index: 2;
        }

        /* STACK LAYER 3: Main Stone Archway Frame (B3 to B10) */
        .wall-frame {
            position: absolute;
            top: 20%; 
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh; 
            max-width: 100vw;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        /* STACK LAYER 4: Center Interactive Door */
        .door-container {
            position: absolute;
            z-index: 4;
            top: 55%; 
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 80vh; 
            width: auto;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 20px #8a2be2) brightness(1.2);
            transform: translate(-50%, -51%);
        }

        /* STACK LAYER 5: Foreground Rocks */
        .foreground-rocks {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        /* STACK LAYER 6: Left Leaf Cluster (Anchored to Bottom-Left Corner A7-B10) */
        .leaf-left {
            position: absolute;
            bottom: -10vh; /* Pushes base down so top edges sit right around Row 7 */
            left: -2vw;
            width: 28vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
        }

        /* STACK LAYER 6: Right Leaf Cluster (Anchored to Bottom-Right Corner I7-J10) */
        .leaf-right {
            position: absolute;
            bottom: -10vh; /* Pushes base down so top edges sit right around Row 7 */
            right: -2vw;
            width: 28vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            transform: scaleX(-1); /* Mirrored */
        }

        /* MOBILE FIX */
        @media (max-width: 768px) or (max-aspect-ratio: 1/1) {
            .wall-frame, 
            .foreground-rocks {
                width: 100vw;
                height: auto;
            }

            .door-container img {
                width: 48vw;
                height: auto;
            }

            .leaf-left, .leaf-right {
                width: 40vw;
                bottom: -5vh;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Moon in sky -->
        <img src="moon-dithered.png" alt="Moon" class="moon">

        <!-- Tiled Dithered Water -->
        <div class="water-bg"></div>

        <!-- Main Stone Wall Frame -->
        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <!-- Interactive Center Door -->
        <div class="door-container" onclick="enterDoor('davis.html')">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <!-- Foreground Rocks Layer -->
        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">

        <!-- Left Leaves (Red Box Target: Bottom-Left A7-B10) -->
        <img src="leafs-dithered.png" alt="Left Leaves" class="leaf-left">

        <!-- Right Leaves (Red Box Target: Bottom-Right I7-J10) -->
        <img src="leafs-dithered.png" alt="Right Leaves" class="leaf-right">
    </div>

    <!-- Door Opening Sound Effect -->
    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        function enterDoor(destination) {
            var audio = document.getElementById("doorAudio");
            
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) { /* Audio fallback */ });
            }

            setTimeout(function() {
                window.location.href = destination;
            }, 600);
        }
    </script>

</body>
</html>
