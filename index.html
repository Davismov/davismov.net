<style>
        :root {
            --body-bg-image: url('https://sadhost.neocities.org/images/tiles/purplesky.gif');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            background-image: var(--body-bg-image);
            background-size: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Centered viewport box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            overflow: hidden;
            background-color: #000000;
        }

        /* STACK LAYER 1: Stars Sky Background */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: url('stars.gif') repeat;
            z-index: 1;
        }

        /* STACK LAYER 2: Shimmering Horizon Water */
        .water-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: url('water.gif') repeat-x;
            background-size: cover;
            z-index: 2;
        }

        /* STACK LAYER 3: Main Stone Archway Frame */
        .wall-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
            pointer-events: none;
        }

        /* STACK LAYER 4: Center Interactive Door */
        .door-container {
            position: absolute;
            z-index: 4;
            /* Positioning relative to the archway cutout */
            top: 46%; 
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            /* Increased size so the door fills the stone cutout gap */
            height: 68vh;
            width: auto;
            max-height: 750px;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 15px #8a2be2) brightness(1.15);
            transform: translate(-50%, -52%);
        }

        /* STACK LAYER 5: Foreground Rocks */
        .foreground-rocks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            pointer-events: none;
        }
    </style>
