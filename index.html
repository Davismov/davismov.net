<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0px;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background-image: url('stars-dithered.gif');
            background-repeat: repeat;
            background-size: 65px 65px;
            z-index: 1;
        }

        .stars-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('no%20shooting%20star-dithered.gif');
            background-repeat: repeat;
            background-size: 130px 130px;
            opacity: 0;
            animation: rareShootingStar 30s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes rareShootingStar {
            0%, 94%, 100% {
                opacity: 0;
            }
            97% {
                opacity: 0.85;
            }
        }

        .side-mask-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998; 
            pointer-events: none;
        }

        .side-mask-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 15vw; 
            height: 100%;
            background-color: #000000;
            z-index: 9998;
            pointer-events: none;
        }

        .moon {
            position: absolute;
            top: 2vh;
            right: 40vw;
            width: auto;
            height: 12vh;
            z-index: 1;
            pointer-events: none;
        }

        .water-bg {
            position: absolute;
            top: 59%;
            bottom: 0;
            left: 0;
            width: 100%;
            background: url('water-dithered.gif') repeat;
            background-size: 64px 64px;
            z-index: 2;
        }

        .wall-frame {
            position: absolute;
            top: 20%; 
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh; 
            max-width: 100vw;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        .door-container {
            position: absolute;
            z-index: 4;
            top: 59%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 80vh;
            width: auto;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 20px #8a2be2) brightness(1.2);
            transform: translate(-50%, -51%);
        }

        .foreground-rocks {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 80vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        .leaf-left {
            position: absolute;
            bottom: -43vh;
            left: -40vw;
            width: 82vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        .leaf-right {
            position: absolute;
            bottom: -12vh;
            right: -5vw;
            width: 48vw;
            height: auto;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            transform: scaleX(-1) rotate(25deg);
        }

        #darkness-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #clay-gif {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 768px) {
            #viewport {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .side-mask-left, 
            .side-mask-right {
                width: 5vw;
            }

            .moon {
                height: 10vh;
                top: 2vh;
                right: 15vw;
            }

            .wall-frame, 
            .foreground-rocks {
                top: 25%;
                height: 60vh;
                width: auto;
            }

            .door-container {
                top: 51%;
            }

            .door-container img {
                height: 60vh;
                width: auto;
            }

            .water-bg {
                top: 55%;
            }

            .leaf-left {
                width: 60vw;
                bottom: -28vh;
                left: -12vw;
            }

            .leaf-right {
                width: 55vw;
                bottom: -8vh;
                right: -10vw;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="stars-bg"></div>

        <div class="side-mask-left"></div>
        <div class="side-mask-right"></div>

        <img src="moon-dithered.png" alt="Moon" class="moon">

        <div class="water-bg"></div>

        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <div class="door-container" onclick="openDoor()">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">

        <img src="leafs-dithered.png" alt="Left Leaves" class="leaf-left">

        <img src="leafs-dithered.png" alt="Right Leaves" class="leaf-right">
    </div>

    <div id="darkness-room">
        <img id="clay-gif" src="clayface.gif" alt="Clay Face">
    </div>

    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        // How long the clayface.gif animation actually runs, in milliseconds.
        // Set this to match your GIF's real duration (frame count x frame delay).
        var CLAY_GIF_DURATION_MS = 2500;

        function openDoor() {
            var audio = document.getElementById("doorAudio");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) {});
            }

            var room = document.getElementById("darkness-room");
            var gifImage = document.getElementById("clay-gif");

            gifImage.src = "clayface.gif?" + Date.now();

            room.style.display = "flex";

            clearTimeout(window._clayFreezeTimer);
            window._clayFreezeTimer = setTimeout(function() {
                gifImage.src = "clayface-final-frame.png";
            }, CLAY_GIF_DURATION_MS);
        }
    </script>

</body>
</html>
