<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>davismov.net</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --body-bg-image: url('https://sadhost.neocities.org/images/tiles/purplesky.gif');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            background-image: var(--body-bg-image);
            background-size: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
        }

        /* Centered viewport box */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* BATTLESHIP GRID OVERLAY (A-J / 1-10) */
        #viewport::after {
            content: "A1 B1 C1 D1 E1 F1 G1 H1 I1 J1";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 0, 0.45) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 0, 0.45) 1px, transparent 1px);
            background-size: 10% 10%;
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
            letter-spacing: 2vw;
            box-shadow: inset 0 0 0 2px rgba(255, 0, 0, 0.6);
        }

        /* STACK LAYER 1: Tiled Purple Sky Background */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: var(--body-bg-image) repeat;
            background-size: 65px 65px;
            z-index: 1;
        }

        /* STACK LAYER 2: Moon (Top Right Corner) */
        .moon {
            position: absolute;
            top: 4vh;
            right: 4vw;
            width: auto;
            height: 18vh;
            z-index: 2;
            pointer-events: none;
        }

        /* STACK LAYER 2.5: Tiled Dithered Water Background */
        .water-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: url('water-dithered.gif') repeat;
            background-size: 64px 64px; 
            z-index: 2;
        }

        /* STACK LAYER 3: Main Stone Archway Frame */
        .wall-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: 85vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 3;
            pointer-events: none;
        }

        /* STACK LAYER 4: Center Interactive Door */
        .door-container {
            position: absolute;
            z-index: 4;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
        }

        .door-container img {
            display: block;
            height: 86.4vh; 
            width: auto;
        }

        .door-container:hover {
            filter: drop-shadow(0 0 20px #8a2be2) brightness(1.2);
            transform: translate(-50%, -51%);
        }

        /* STACK LAYER 5: Original Foreground Rocks (Restored) */
        .foreground-rocks {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: 85vh;
            max-width: 100vw;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        /* STACK LAYER 6: Foreground Leaves (Lowered Massively) */
        .foreground-leaves-close {
            position: absolute;
            bottom: -68vh; /* Lowered down so only top tips peek over row 8/9 */
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: 110vh; /* Reduced height to stop full-screen coverage */
            max-width: 140vw;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
        }

        /* MOBILE / NARROW SCREEN FIX */
        @media (max-width: 768px) or (max-aspect-ratio: 1/1) {
            .wall-frame, 
            .foreground-rocks {
                width: 100vw;
                height: auto;
                max-width: none;
            }

            .door-container img {
                width: 48vw;
                height: auto;
            }

            .door-container {
                top: 48%;
            }

            .foreground-leaves-close {
                width: 120vw;
                height: auto;
                bottom: -22vh;
                max-width: none;
            }

            .moon {
                height: 12vh;
                top: 2vh;
                right: 3vw;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Animated Backgrounds & Moon -->
        <div class="stars-bg"></div>
        <img src="moon-dithered.png" alt="Moon" class="moon">
        <div class="water-bg"></div>

        <!-- Main Stone Wall Frame -->
        <img src="rockwall.png" alt="Stone Wall" class="wall-frame">

        <!-- Interactive Center Door -->
        <div class="door-container" onclick="enterDoor('davis.html')">
            <img src="Door-Davis.png" alt="Davis.mov Entryway">
        </div>

        <!-- Foreground Rocks Layer (Original Placement) -->
        <img src="rocks.png" alt="Foreground Rocks" class="foreground-rocks">

        <!-- Foreground Leaves Layer (Peeking at the bottom) -->
        <img src="leafs-dithered.png" alt="Peeking Leaves" class="foreground-leaves-close">
    </div>

    <!-- Door Opening Sound Effect -->
    <audio id="doorAudio" src="door-open.mp3" preload="auto"></audio>

    <script>
        function enterDoor(destination) {
            var audio = document.getElementById("doorAudio");
            
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function(e) { /* Audio fallback */ });
            }

            setTimeout(function() {
                window.location.href = destination;
            }, 600);
        }
    </script>

</body>
</html>
